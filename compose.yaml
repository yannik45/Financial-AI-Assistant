services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: financial-intelligence-api:local
    init: true
    ports:
      - "8000:8000"
    environment:
      FINANCIAL_AI_CORS_ORIGINS: '["http://localhost:5173"]'
      FINANCIAL_AI_ALPACA_API_KEY: ${FINANCIAL_AI_ALPACA_API_KEY:-}
      FINANCIAL_AI_ALPACA_SECRET_KEY: ${FINANCIAL_AI_ALPACA_SECRET_KEY:-}
      FINANCIAL_AI_SEC_USER_AGENT: ${FINANCIAL_AI_SEC_USER_AGENT:-Financial-Intelligence-Platform/0.1 github.com/yannik45/Financial-Intelligence-Platform}
      FINANCIAL_AI_MARKET_DATA_CACHE_HOURS: ${FINANCIAL_AI_MARKET_DATA_CACHE_HOURS:-24}
    volumes:
      - financial_ai_runtime:/app/data/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 600s

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: financial-intelligence-web:local
    init: true
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  financial_ai_runtime:
