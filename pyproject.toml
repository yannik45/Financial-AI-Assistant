[project]
name = "financial-ai-assistant"
version = "0.1.0"
description = "Local-first financial portfolio intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "scikit-learn>=1.6,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
financial-ai-api = "financial_ai.main:run"
financial-ai-build-category-model = "financial_ai.ml.category_artifact:run"
financial-ai-bootstrap-category-model = "financial_ai.ml.category_bootstrap:run"
financial-ai-build-text-challenge = "financial_ai.ml.text_classification_challenge:run"
financial-ai-evaluate-text-classification = "financial_ai.ml.text_classification_evaluation:run"
financial-ai-export-category-feedback = "financial_ai.ml.feedback_export:run"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/financial_ai"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

